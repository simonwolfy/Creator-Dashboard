[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-intelligence"
version = "5.0.0a2"
description = "Desktop creator analytics and production operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "packaging>=24.0",
  "python-dateutil>=2.9",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
transcription = [
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12>=12.8; platform_system == 'Windows' and platform_machine == 'AMD64'",
  "nvidia-cudnn-cu12>=9.8; platform_system == 'Windows' and platform_machine == 'AMD64'",
]

[tool.setuptools.packages.find]
include = ["creator_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "backups", "exports", "temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
