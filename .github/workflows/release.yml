name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Regression tests
        run: python -m pytest
      - name: Privacy and history release gate
        run: python -m creator_intelligence.core.privacy_audit --history
      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean CreatorIntelligence.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: ISCC.exe installer\CreatorIntelligence.iss
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: creator-intelligence-windows
          path: release/*
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --generate-notes --verify-tag
